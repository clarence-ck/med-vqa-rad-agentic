services:
  - type: web
    name: clariscan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python ../scripts/download_dataset.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: BACKEND_CORS_ORIGINS
        sync: false
