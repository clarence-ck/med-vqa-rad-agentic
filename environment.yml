name: medvisionquery
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy
  - pytorch
  - tectonic      # builds the LaTeX report (scripts/run_all.py --stages report)
  - pip:
      - fastapi
      - uvicorn
      - python-dotenv
      - openai
      - Pillow
      - python-multipart
      - datasets
      - haystack-ai
      - sentence-transformers
      - scikit-learn
      - scipy
      - matplotlib
